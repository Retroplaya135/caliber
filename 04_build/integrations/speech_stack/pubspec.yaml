name: caliber_speech_stack
description: Capability-aware STT integration stack for caliber.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.12.0 <4.0.0"

resolution: workspace

dependencies:
  caliber_shared: ^0.1.0

dev_dependencies:
  coverage: ^1.15.0
  melos: ^7.8.0
  test: ^1.31.0

melos:
  useRootAsPackage: true
  scripts:
    analyze:
      run: dart analyze .
      description: Analyze the Speech Stack integration package.
    test:
      run: dart run test/run_all.dart
      description: Run Speech Stack contract, privacy, pipeline, and benchmark tests.
    benchmark:jargon:
      run: dart run bin/jargon_stt_benchmark.dart
      description: Run the local jargon-STT benchmark harness fixture.
