name: caliber_shared
description: Frozen Schema Core contracts for caliber feature lanes.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"

resolution: workspace

dependencies:
  freezed_annotation: ^3.1.0
  json_annotation: ">=4.9.0 <4.10.0"

dev_dependencies:
  build_runner: ^2.5.4
  coverage: ^1.15.0
  freezed: ^3.1.0
  json_serializable: ^6.9.5
  melos: ^7.0.0
  test: ^1.31.0

melos:
  packages:
    - .
  scripts:
    analyze:
      run: dart analyze .
      description: Analyze the frozen Schema Core package.
    test:
      run: dart test --coverage=coverage
      description: Run Schema Core tests with VM coverage collection.
    codegen:
      run: dart run build_runner build
      description: Generate Freezed and json_serializable outputs.
    guardrails:
      run: dart test test/guardrails
      description: Run Schema Core boundary and version guardrails.
