name: caliber_storage_sync
description: Local-first encrypted persistence and signed corpus bundle sync for caliber.
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.35.0"

resolution: workspace

dependencies:
  cryptography: ^2.9.0
  crypto: ^3.0.6
  drift: ">=2.25.0 <2.33.0"
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  meta: ^1.16.0
  path: ^1.9.1
  path_provider: ^2.1.5
  sqlite3: ">=2.7.0 <3.0.0"

dev_dependencies:
  build_runner: ^2.5.4
  drift_dev: ">=2.25.0 <2.33.0"
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
