[project]
name = "caliber-ai-gateway"
version = "0.1.0"
description = "Deterministic AI gateway behind caliber's StructuredJudge interface."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.136.3",
  "openai>=2.31.0,<3",
  "pydantic>=2.12,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "coverage>=7,<8",
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src/caliber_ai_gateway"]

[tool.coverage.report]
show_missing = true
fail_under = 90
