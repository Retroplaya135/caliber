[project]
name = "caliber-resume-worker"
version = "0.1.0"
description = "Ephemeral resume parsing, evidence-grounded rewrite, and deterministic ATS reporting for caliber."
requires-python = ">=3.11"
dependencies = [
  "PyMuPDF==1.27.2.3",
  "pypdf==6.12.2",
  "python-docx==1.2.0",
  "unstructured==0.22.31",
  "rapidfuzz==3.14.5",
]

[project.optional-dependencies]
dev = []

[tool.caliber]
lane = "fork/07-resume-evidence"
scope = "04_build/workers/resume"
ats_test_matrix_version = "ats-matrix-2026-05-31.v1"
