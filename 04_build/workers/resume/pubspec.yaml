name: caliber_resume_worker
publish_to: none
environment:
  sdk: ">=3.12.0 <4.0.0"

dev_dependencies:
  melos: 7.8.0

melos:
  useRootAsPackage: true
  scripts:
    analyze:
      run: python3 -m resume_worker.tools.analyze
      description: Compile and statically inspect the Resume Evidence worker.
    test:
      run: python3 -m resume_worker.tools.test --coverage
      description: Run unit tests and stdlib trace coverage for the Resume Evidence worker.
    profile:
      run: python3 -m resume_worker.tools.profile
      description: Run timing evidence for parse, rewrite review, and ATS harness paths.
    guardrails:
      run: python3 -m resume_worker.tools.guardrails
      description: Run worker-local handoff, profile, secret, and TLS guardrails.
